[package]
name = "clipvault"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Privacy-first offline clipboard history manager for Windows and Linux"
homepage = "https://github.com/ryzellx/clipvault"
repository = "https://github.com/ryzellx/clipvault"
authors = ["ClipVault Contributors"]
keywords = ["clipboard", "privacy", "desktop", "history"]
categories = ["command-line-utilities"]

[lib]
name = "clipvault"
path = "src/lib.rs"

[[bin]]
name = "clipvault"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
arboard = "3"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
